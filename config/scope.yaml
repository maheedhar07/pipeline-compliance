# What to scan. Unknown keys are rejected at load time. Validate with `pch doctor`.
# In APP_ENV=prod this file is REQUIRED.

# Where the code lives: github (default), github_enterprise, azure_repos, other_git. Azure Repos is OFF unless listed: its API is
# not called and pipelines/releases sourced from a host that is not listed are out of scope (one info line per project).
code_hosts: [github]

# Azure DevOps organization name (the <org> in https://dev.azure.com/<org>). Optional: used only when ADO_ORG is not set.
# If both are set they must be equal, otherwise the scan and `pch doctor` fail with a config error (nothing is picked silently).
# Example: organization: contoso
organization: ""
# Projects to scan; empty = discover all projects in the organization.
projects: []
# Repos to skip, as "<project>/<repo>", e.g. ["Sandbox/scratch-repo"]. Code hosted on GitHub (built by ADO pipelines) is
# named "<org>/<repo>": "<project>/<org>/<repo>". Matching is case-insensitive.
exclude_repos: []
# GitHub reader (needs GITHUB_TOKEN or a GitHub App, see README "GitHub reader"). Repos = org listing (filtered) + repos referenced
# by ADO pipelines + `repos:` below. Repos with no ADO pipeline are keyed "<org>/<org>/<repo>".
github:
  orgs: []                  # e.g. [acme]
  include: []               # globs on repo or org/repo, case-insensitive; empty = all
  exclude: []               # e.g. ["sandbox-*"]
  topics_any: []            # keep repos with at least one of these topics; empty = no topic filter
  include_archived: false
  include_forks: false
# Stage/environment name -> tier (test/uat/prod ...), applied BEFORE the name-based regex.
env_tiers: {}
# Per-repo overrides (project and repo required, the rest optional):
repos: []
#  - project: Payments
#    repo: payments-api                 # GitHub-hosted code: org/repo
#    sonar_key: myorg_payments-api      # SonarQube project key
#    aikido_repo: payments-api          # repo name in Aikido
#    owner: team-payments@example.com
#    servicenow_ci: payments-api        # ServiceNow configuration item
#    coverage_threshold: 70             # overrides policy.coverage_threshold
#    env_tiers: {}                      # per-repo env_tiers override
