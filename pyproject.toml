[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeline-compliance"
version = "0.1.0"
description = "Report-only CI/CD compliance dashboard for Azure DevOps, SonarQube, Aikido and ServiceNow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "jinja2>=3.1,<4",
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "tenacity>=8.2,<10",
  "typer>=0.12,<1",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
azuresql = ["pyodbc>=5,<6", "azure-identity>=1.15,<2"]
azure-keyvault = ["azure-keyvault-secrets>=4.7,<5", "azure-identity>=1.15,<2"]
azure-blob = ["azure-storage-blob>=12.19,<13", "azure-identity>=1.15,<2"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.4",
  "mypy>=1.8",
  "types-PyYAML",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pip-tools>=7.4",
]

[project.scripts]
pch = "pch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pch"]
# Alembic migrations ship inside the package (src/pch/store/migrations, incl. versions/*.py and script.py.mako).

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["src/pch"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"src/pch/store/migrations/versions/*" = ["E", "I", "UP"]
"src/pch/demo/generator.py" = ["E702"]
"tests/*" = ["E501", "E731"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
