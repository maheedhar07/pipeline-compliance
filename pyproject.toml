[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeline-compliance"
version = "0.1.0"
description = "Report-only CI/CD compliance dashboard for Azure DevOps, SonarQube, Aikido and ServiceNow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "jinja2>=3.1",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "tenacity>=8.2",
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.4",
  "mypy>=1.8",
  "types-PyYAML",
]

[project.scripts]
pch = "pch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["src/pch"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"src/pch/demo/generator.py" = ["E702"]
"tests/*" = ["E501", "E731"]
