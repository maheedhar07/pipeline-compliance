trigger:
  branches:
    include: [main]
stages:
  - stage: Build
    jobs:
      - job: build
        pool: {vmImage: ubuntu-latest}
        steps:
          - task: SonarQubePrepare@5
            inputs: {SonarQube: sonar-conn, projectKey: contoso-payments_orders-func}
          - task: DotNetCoreCLI@2
            displayName: Test
            inputs: {command: test}
          - task: PublishTestResults@2
            inputs: {testResultsFormat: VSTest}
