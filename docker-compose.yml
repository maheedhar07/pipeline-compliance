# Dashboard + Postgres.   docker compose up --build   (the `migrate` service runs `pch db upgrade` first)
# Demo data (no credentials):  docker compose run --rm app sh -c "pch seed-demo && pch scan --demo"
# Real scan (needs .env):      docker compose run --rm app pch scan
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pch
      POSTGRES_PASSWORD: pch-local-dev-only
      POSTGRES_DB: pch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pch -d pch"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply Alembic migrations, then exit. The app only starts after it succeeded.
  migrate:
    build: .
    command: ["pch", "db", "upgrade"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://pch:pch-local-dev-only@db:5432/pch

  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://pch:pch-local-dev-only@db:5432/pch
      # Local dev only: no sign-in. Inside the container the app must listen on 0.0.0.0 for the published port to work,
      # which AUTH_MODE=none normally refuses; AUTH_NONE_ALLOW_CONTAINER_BIND=true permits it in APP_ENV=dev only
      # (refused in prod). Safety rests on the port mapping below being loopback-only: do NOT change it to 0.0.0.0.
      APP_ENV: dev
      AUTH_MODE: none
      AUTH_NONE_ALLOW_CONTAINER_BIND: "true"
      HOST: 0.0.0.0
    volumes:
      - appdata:/app/data
    ports:
      # bound to the host's loopback on purpose: AUTH_MODE=none has no authentication
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
  appdata:
